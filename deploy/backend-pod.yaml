apiVersion: v1
kind: Pod
metadata:
  name: ai-discussion-backend
  labels:
    app: ai-discussion-backend
    "traefik.enable": "true"
    "traefik.http.routers.ai-discussion-backend.rule": "Host(`api.oujun.work`)"
    "traefik.http.routers.ai-discussion-backend.entrypoints": "websecure"
    "traefik.http.routers.ai-discussion-backend.tls.certresolver": "cloudflare"
    "traefik.http.services.ai-discussion-backend.loadbalancer.server.port": "8200"
spec:
  containers:
    - name: backend
      image: registry.cn-hangzhou.aliyuncs.com/geeky-explorer/ai-discussion-backend:latest
      restartPolicy: always
      env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8200"
        - name: DATABASE_URL
          value: "postgresql://ai:AI2025pass@localhost:5432/ai_discussion?schema=public"
        - name: JWT_SECRET
          value: "AIDiscussion-JWT-Secret-Change-Me"
    - name: postgres
      image: docker.io/library/postgres:15-alpine
      restartPolicy: always
      env:
        - name: POSTGRES_USER
          value: "ai"
        - name: POSTGRES_PASSWORD
          value: "AI2025pass"
        - name: POSTGRES_DB
          value: "ai_discussion"
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: postgres-data
      hostPath:
        path: /var/lib/ai-discussion/postgres
        type: DirectoryOrCreate
